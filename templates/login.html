<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · AI 数学成绩提升系统</title>
<link rel="stylesheet" href="static/css/style.css">
</head>
<body class="login-body">
<div class="login-card">
  <h1>📐 MathBoost</h1>
  <p class="sub">AI 数学成绩提升系统</p>
  {% if not pw_set %}
  <p class="hint">首次使用，请设置一个管理密码（至少 4 位）</p>
  {% endif %}
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}
  <form method="post" action="login">
    <input type="password" name="pw" placeholder="{{ '请输入密码' if pw_set else '设置密码' }}" autofocus required>
    <button type="submit">{{ '登录' if pw_set else '保存并进入' }}</button>
  </form>
  <p class="tiny">方法内核：掌握度建模 · 间隔重复复习 · 智能弱项练习</p>
</div>
</body>
</html>
